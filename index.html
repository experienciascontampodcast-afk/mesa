<title>M.E.S.A. EXP</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#080808;
  --offwhite:#F0EDE8;
  --gold:#C9A84C;
  --gold2:#E2C06A;
  --muted:#C0C0B8;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',sans-serif;
}
html,body{height:100%;width:100%}
body{
  background:var(--black);
  color:var(--offwhite);
  font-family:var(--sans);
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:40px 32px;
  position:relative;
}

/* Fundo sutil */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 50% 50%, rgba(201,168,76,0.04) 0%, transparent 70%);
  pointer-events:none;
}

/* Logo */
.logo{
  position:fixed;
  top:36px;
  left:50%;
  transform:translateX(-50%);
  opacity:0;
  animation:fadeLogo 1.2s 0.3s cubic-bezier(0.16,1,0.3,1) forwards;
}
.logo img{
  height:44px;
  width:auto;
  display:block;
}

/* Conteúdo central */
.centro{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:0;
  max-width:720px;
}

/* Frase */
.frase{
  font-family:var(--serif);
  font-weight:200;
  color:var(--offwhite);
  overflow:hidden;
  text-align:center;
  width:100%;
  line-height:1.2;
}

.linha{
  display:block;
  overflow:hidden;
}
.linha span{
  display:block;
  transform:translateY(110%);
  transition:transform 1.3s cubic-bezier(0.16,1,0.3,1);
}
.linha.pequena span{ font-size:clamp(13px,1.4vw,18px); letter-spacing:4px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
.linha.media span{ font-size:clamp(16px,2vw,26px); font-style:italic; line-height:1.6; }
.linha.gigante span{ font-size:clamp(50px,8vw,110px); font-weight:200; font-style:normal; color:var(--gold); letter-spacing:0.08em; line-height:1; margin:8px 0; }

.linha:nth-child(1) span{transition-delay:0.4s}
.linha:nth-child(2) span{transition-delay:0.58s}
.linha:nth-child(3) span{transition-delay:0.76s}
.linha:nth-child(4) span{transition-delay:0.88s}
.linha:nth-child(5) span{transition-delay:1.06s}

body.loaded .linha span{
  transform:translateY(0);
}

/* Linha dourada */
.regua{
  width:0;
  height:0.5px;
  background:linear-gradient(to right, transparent, var(--gold), transparent);
  margin:40px auto 36px;
  transition:width 1.2s 1.6s cubic-bezier(0.16,1,0.3,1);
}
body.loaded .regua{
  width:64px;
}

/* Em breve */
.em-breve{
  font-size:16px;
  letter-spacing:10px;
  text-transform:uppercase;
  color:rgba(201,168,76,0.9);
  opacity:0;
  animation:fadeSimple 1s 2s cubic-bezier(0.16,1,0.3,1) forwards;
  text-align:center;
  display:block;
}

/* Rodapé sutil */
.rodape{
  position:fixed;
  bottom:32px;
  left:50%;
  transform:translateX(-50%);
  font-size:9px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:rgba(192,192,184,0.35);
  opacity:0;
  animation:fadeFixed 1s 2.4s cubic-bezier(0.16,1,0.3,1) forwards;
  white-space:nowrap;
}

@keyframes fadeFixed{
  from{opacity:0;transform:translateX(-50%) translateY(8px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}
}
@keyframes fadeSimple{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeLogo{
  from{opacity:0;transform:translateX(-50%) translateY(8px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}
}

/* Mobile */
@media(max-width:480px){
  .logo img{height:36px}
  .regua{margin:32px auto 28px}
  .rodape{display:none}
}
</style>

    canvas.width = Math.round(h * ratio * 2);
    canvas.style.height = h + 'px';
    canvas.style.width = Math.round(h * ratio) + 'px';
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    var data = imageData.data;
    for (var i = 0; i < data.length; i += 4) {
      var r = data[i], g = data[i+1], b = data[i+2];
      var brightness = (r + g + b) / 3;
      if (brightness > 200) {
        data[i+3] = Math.round((255 - brightness) * 1.2);
      }
    }
    ctx.putImageData(imageData, 0, 0);
  };
  img.src = src;
})();
</script>
